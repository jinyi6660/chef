<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYSTERY CHEF — KITCHEN</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* ── STAGE WINDOW ──
     The oven's glass has an opaque black mask painted around a 36.5×17cm
     clear viewing window (the screen itself renders everything — this
     mask is physical, not a CSS crop). The rightmost ~3.5cm of that is
     ALSO covered by a separate black strip on the glass, but that's a
     physical mask too — content renders at the FULL 36.5×17cm size (not
     artificially shrunk to dodge it), since the glass already hides
     whatever falls in that strip for free, and rendering bigger keeps
     everything else from looking unnecessarily small. Sized in hardcoded
     px since this is a physical cutout, not something that should scale
     with the browser viewport like vw/vh would.

     CALIBRATION: --stage-x/--stage-y nudge the window without touching
     the layout logic above — tweak these two numbers directly on the
     physical device while eyeballing the real result through the oven
     cutout (positive x = right, positive y = up), instead of guessing
     blind over chat. Leave at 0,0 once it lines up. */
  :root {
    --stage-x: -60px;
    --stage-y: 105px;
  }
  #stage-window {
    position: fixed;
    left: calc(0px + var(--stage-x));
    bottom: calc(0px + var(--stage-y));
    width: 1859px;  /* 36.5cm */
    height: 866px;  /* 17cm */
    overflow: hidden;
    z-index: 0;
  }

  #bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    /* contain, not cover — back.jpg (4961×3508) is much taller-per-width
       than the new wide stage-window, and cropping it to cover cut the
       plate/knife off top and bottom. Showing the full image letterboxed
       (empty sides) was chosen over losing that content. */
    object-fit: contain;
    object-position: center;
    z-index: 0;
  }

  /* screen starts pure black — the paper book only appears once the
     page-turn video has finished, revealed via .revealed */
  #bg, #book {
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #bg.revealed, #book.revealed {
    opacity: 1;
  }

  /* light scanline grain */
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9000;
    background: repeating-linear-gradient(
      0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px,
      transparent 1px, transparent 3px
    );
  }

  /* ── BOOK LAYOUT ──
     #book is sized to back.jpg's own 4961×3508 ratio (contain-fit within
     the wider stage-window, centered — matches #bg's object-fit:contain
     above) rather than stretched to the full window, so its children's
     percentages (zone-ingr, method-video-wrap, both original values) line
     up with where the image content actually is instead of empty
     letterbox space. */
  #book {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    height: 100%;
    aspect-ratio: 4961 / 3508;
    max-width: 100%;
    z-index: 1;
  }

  /* full-book dark overlay, fades in with the reveal (0 -> 59% opacity) */
  #dim-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }
  #book.revealed #dim-overlay { opacity: 0.72; }

  /* Left page ingredient zone — 6%→47% of book width, 5%→95% height */
  #zone-ingr {
    position: absolute;
    left: 6%; top: 5%;
    width: 41%;
    bottom: 5%;
    overflow: hidden;
  }

  /* plate mask — clips scattered tags/images to the plate shape only */
  #plate-mask {
    position: absolute;
    inset: 0;
    clip-path: polygon(76% 7%, 91% 10%, 98% 18%, 98% 42%, 96% 64%, 89% 78%, 70% 92%, 27% 74%, 17% 52%, 35% 23%);
    pointer-events: none;
  }

  /* emotion tag labels */
  .ingr-tag {
    position: absolute;
    font-family: 'Courier Prime', monospace;
    font-size: clamp(11px, 1.5vw, 18px);
    font-weight: 700;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 0 6px rgba(255,255,255,0.75), 0 0 14px rgba(255,255,255,0.4);
    opacity: 0;
    transition: opacity 1s ease;
    white-space: nowrap;
    pointer-events: none;
    line-height: 1;
  }
  .ingr-tag.show { opacity: 1; }
  .ingr-tag.typing::after {
    content: '|';
    margin-left: 1px;
    animation: tag-blink 0.8s step-end infinite;
  }
  @keyframes tag-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ── METHOD ZONE — AE overlay video (right page of back.jpg) ── */
  #method-video-wrap {
    position: absolute;
    left: 50.5%; top: 5%;
    width: 41.5%;
    height: 90%;
    overflow: hidden;
    pointer-events: none;
  }
  #method-video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    /* source is 16:9 but this box is much taller/narrower — cover fills
       the full page height and crops the sides, keeping a vertical slice
       centered on where the text column actually sits (~76% across) */
    object-fit: cover;
    object-position: 76% top;
    pointer-events: none;
    /* subtle glow following the text's own silhouette (drop-shadow, not
       box-shadow, so it hugs the letters rather than boxing the frame) */
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.65))
            drop-shadow(0 0 12px rgba(255,255,255,0.35));
  }

  /* ── IDLE HINT ── */
  #idle-hint {
    position: absolute;
    bottom: 16px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier Prime', monospace;
    font-size: clamp(9px, 1vw, 13px);
    letter-spacing: 0.5em;
    color: rgba(22,14,6,0.22);
    text-transform: uppercase;
    z-index: 500;
    animation: breathe 3.5s ease-in-out infinite;
    transition: opacity 0.8s ease;
  }
  #idle-hint.hidden { opacity: 0; pointer-events: none; }
  @keyframes breathe { 0%,100%{opacity:0.3} 50%{opacity:0.9} }

  /* ── SHOW VIDEO OVERLAY (page-turn / cooking) ── */
  #show-video {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 94%; height: 94%;
    object-fit: cover; z-index: 800; background: #000;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  #show-video.on { opacity: 1; }

  /* idle standby cover — a still snapshot of back1.mp4's opening frame,
     shown instead of the paused <video> itself: pausing a <video> element
     drops the painted frame back to black on this hardware/browser combo,
     so a real frozen still has to be a plain <img>, not a paused video */
  #idle-cover {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 94%; height: 94%;
    object-fit: cover; z-index: 800; background: #000;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  #idle-cover.on { opacity: 1; }

  /* dims the idle standby frame while waiting for an order — fades out
     to fully clear the moment an order comes in */
  #idle-dim {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 94%; height: 94%;
    background: #000; z-index: 805;
    opacity: 0; pointer-events: none; transition: opacity 3s ease;
  }
  #idle-dim.on { opacity: 0.88; }

  /* final reveal — the actual generated dish image, shown in place of
     the loading video once it's ready, and left up (not hidden again) */
  #dish-reveal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 94%; height: 94%;
    object-fit: contain; z-index: 810; background: #000;
    opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
  }
  #dish-reveal.on { opacity: 1; }

  /* captions the three chefs' relay commentary during stage1-3, in case
     the spoken audio is hard to hear in the exhibition space — a
     full-width banner that slides in from the left edge for each line
     and slides back out before the next one, rather than a small boxed
     caption sitting on the dialogue.png artwork */
  #relay-caption-wrap {
    position: absolute; left: 0; right: 0; bottom: 6%;
    width: 100%;
    background: rgba(0,0,0,0.68);
    border-top: 1px solid rgba(255,255,255,0.18);
    border-bottom: 1px solid rgba(255,255,255,0.18);
    z-index: 820;
    padding: 16px 6%;
    pointer-events: none;
    transform: translateX(-100%);
    transition: transform 0.45s ease;
  }
  #relay-caption-wrap.on { transform: translateX(0); }
  #relay-caption {
    text-align: left;
    font-family: 'Courier Prime', monospace;
    font-size: 22px; line-height: 1.45; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  /* ── STATUS BAR ── */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 22px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; z-index: 1000;
    font-family: 'Courier Prime', monospace;
    font-size: 8px; letter-spacing: 0.22em;
    color: rgba(22,14,6,0.22); text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- everything the audience can actually see through the oven's cutout
     lives in here — see #stage-window in the CSS above -->
<div id="stage-window">
  <img id="bg" src="back.jpg" alt="">

  <video id="show-video" muted playsinline></video>
  <img id="idle-cover" alt="">
  <div id="idle-dim"></div>
  <img id="dish-reveal" alt="">
  <div id="relay-caption-wrap"><div id="relay-caption"></div></div>

  <div id="book">
    <div id="dim-overlay"></div>

    <!-- INGREDIENT ZONE — left page of back.jpg -->
    <div id="zone-ingr">
      <div id="plate-mask"></div>
    </div>

    <!-- METHOD ZONE — AE overlay video -->
    <div id="method-video-wrap">
      <video id="method-video" autoplay muted playsinline>
        <source src="2.webm" type="video/webm">
        <source src="合成 2_4.mov" type="video/quicktime">
      </video>
    </div>
  </div>

  <span id="idle-hint">awaiting order</span>
</div>

<audio id="voice-audio"></audio>
<audio id="relay-audio"></audio>
<audio id="stage4-loop-audio" loop></audio>
<audio id="stage4-end-audio"></audio>
<audio id="stage123-ambient-audio" loop></audio>
<audio id="reading-ambient-audio" src="reading_page_ambient.wav"></audio>
<audio id="pageturn-audio" src="pageturn_sound.wav"></audio>
<audio id="recipe-narration-audio" src="recipe_narration.mp3"></audio>

<div id="bar">
  <span>MYSTERY CHEF</span>
  <span id="bar-phase">STANDBY</span>
  <span id="bar-clock">--:--:--</span>
</div>

<script>
// ── AUDIO-ONLY MODE ───────────────────────────────────────────
// kitchen.html?audio_only=1 — for a second real instance of this exact
// page run on the iPad purely for correctly-timed headphone audio
// (replacing the old poll-and-guess mirror in order.html). Skips loading
// and playing every video entirely — running two full copies of this
// show at once was pulling down the same large video files on both
// devices simultaneously and stalling out the connection, leaving a
// black screen with audio still playing underneath (audio files are
// tiny by comparison and were never affected). Phase-posting, timing,
// and every actual sound still run identically either way.
const AUDIO_ONLY = new URLSearchParams(location.search).get('audio_only') === '1';
if (AUDIO_ONLY) {
  // #method-video has autoplay + <source> children, so the browser starts
  // fetching it the instant the HTML is parsed — before this very script
  // block even runs. Strip its sources and force-abort the in-progress
  // fetch immediately, rather than only guarding the later JS play()
  // calls (which would leave the initial autoplay download running).
  const mv = document.getElementById('method-video');
  if (mv) {
    mv.autoplay = false;
    mv.pause();
    mv.removeAttribute('src');
    mv.querySelectorAll('source').forEach(s => s.remove());
    mv.load();
  }
}

// ── EMOTION TAG placement (relative to #plate-mask, inside the plate) ───────
// picks a random point inside a safe ellipse that stays clear of the
// plate's clip-path edge, plus a random tilt
function randomPlatePos() {
  const cx = 57.5, cy = 49.5, rx = 32, ry = 34;
  const angle = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * 0.85; // sqrt for even area coverage, 0.85 = margin from edge
  const top    = cy + Math.sin(angle) * ry * r;
  const left   = cx + Math.cos(angle) * rx * r;
  const rotate = Math.round(-12 + Math.random() * 24);
  return { top: `${top.toFixed(1)}%`, left: `${left.toFixed(1)}%`, rotate };
}

// back1.mp4 — the "digital file browser" video. It sits on screen as a
// standby frame from the moment kitchen.html loads (whether or not an
// order has come in yet), and only starts actually playing once a guest
// submits — then it plays through once, before the paper book is revealed.
const PAGE_TURN_VIDEO_SRC = 'back2.mp4'; // re-exported at 1834x866 to match the new stage-window ratio
const PAGE_TURN_FILE_DURATION_SEC = 32.04; // back2.mp4's real, unsped length
const PAGE_TURN_PLAYBACK_RATE = 1.4; // sped up — the page-turn felt too slow at natural speed
const PAGE_TURN_DURATION_SEC = PAGE_TURN_FILE_DURATION_SEC / PAGE_TURN_PLAYBACK_RATE; // used to time audio-only mode without loading the file at all
const SKIP_PAGE_TURN = false;

// ── UTILS ─────────────────────────────────────────────────────
const sleep    = ms => new Promise(r => setTimeout(r, ms));
const setPhase = s  => document.getElementById('bar-phase').textContent = s;

setInterval(() => {
  document.getElementById('bar-clock').textContent =
    new Date().toTimeString().slice(0, 8);
}, 1000);

// ── RESET ─────────────────────────────────────────────────────
function resetDisplay() {
  document.getElementById('plate-mask').innerHTML = '';
  document.getElementById('dish-reveal').classList.remove('on');
  document.getElementById('relay-caption-wrap').classList.remove('on');
  clearInterval(_captionTimer);
}

// ── IDLE ──────────────────────────────────────────────────────
function setIdle(on) {
  document.getElementById('idle-hint').classList.toggle('hidden', !on);
}

// ── STAGE (paper book) VISIBILITY ──────────────────────────────
// screen is pure black until the page-turn video finishes; only then
// does the physical book (back.jpg + plate/method overlays) fade in
function hideStage() {
  document.getElementById('bg').classList.remove('revealed');
  document.getElementById('book').classList.remove('revealed');
}
function revealStage() {
  // belt-and-suspenders: playIdlePageTurn() already stops this itself
  // when the page-turn video ends, but if anything upstream ever skips
  // or short-circuits that (an error, a race, SKIP_PAGE_TURN), the rustle
  // sound could otherwise keep playing into the reading phase — guarantee
  // it's off by the time the recipe book actually starts.
  document.getElementById('pageturn-audio').pause();
  // book/bg reveal itself is now held back until the text-overlay video is
  // about to actually start (see setTimeout below) instead of firing
  // immediately — revealing the book first meant the guest saw a few
  // seconds of the blank/empty recipe book before any text appeared on
  // it, which read as its own separate "empty book" beat rather than one
  // cohesive reveal.
  const revealBook = () => {
    document.getElementById('bg').classList.add('revealed');
    document.getElementById('book').classList.add('revealed');
  };
  // this page should only ever have the narration voice on it, and the
  // text-overlay video should move in step with that voice — not two
  // independent things that happen to overlap. Narration always stays at
  // its natural, un-sped-up pace (speeding it up was tried before and
  // made it sound rushed — explicit feedback was to never do that again);
  // instead the VIDEO's rate is stretched/compressed to match the
  // narration's actual length, the same technique playSyncedStage() below
  // already uses for the cooking-stage videos.
  const narration = document.getElementById('recipe-narration-audio');
  narration.pause();
  narration.currentTime = 0;
  narration.playbackRate = 1;

  if (!AUDIO_ONLY) {
    const mv = document.getElementById('method-video');
    mv.pause();
    // the source file itself has ~4s of blank/transparent lead-in before
    // any text actually appears (confirmed by sampling frames) — skip
    // straight past it instead of sitting on an empty page for a while
    mv.currentTime = 4;
    setTimeout(() => {
      // the video's own usable content is only ~12s, but the narration is
      // often 40s+ — stretching one pass to match used to need extreme
      // slow-motion (computed rate landed near 0.25x), and video played
      // that slow looks choppy/frozen rather than smooth, which read as
      // the show "getting stuck". Loop it at a fixed, natural-ish pace
      // instead and just stop it manually once the narration ends (see
      // the wait loop further down) rather than timing one pass to match.
      mv.loop = true;
      mv.playbackRate = 0.7;
      mv.play().catch(() => {});
      narration.play().catch(() => {});
      revealBook(); // book fades in together with video+narration starting, not before
    }, 1200);
  } else {
    revealBook();
    setTimeout(() => { narration.play().catch(() => {}); }, 1200);
  }
}

// ── INGREDIENT TAGS ──────────────────────────────────────────
async function typeTag(el, text) {
  el.classList.add('show', 'typing');
  for (const ch of text) {
    el.textContent += ch;
    await sleep(55);
  }
  el.classList.remove('typing');
}

async function showTags(tags) {
  const zone = document.getElementById('plate-mask');
  for (const tag of tags) {
    const pos = randomPlatePos();
    const el  = document.createElement('div');
    el.className = 'ingr-tag';
    // random size per tag — some words read bigger/smaller than others
    const scale = 0.9 + Math.random() * 1.1; // 0.9x – 2.0x
    const fontSize = `clamp(${(11 * scale).toFixed(1)}px, ${(1.5 * scale).toFixed(2)}vw, ${(18 * scale).toFixed(1)}px)`;
    el.style.cssText =
      `top:${pos.top}; left:${pos.left}; transform:rotate(${pos.rotate}deg); font-size:${fontSize};`;
    zone.appendChild(el);
    await typeTag(el, tag);
    await sleep(250);
  }
}

// ── POLL SERVER ──────────────────────────────────────────────
async function pollState() {
  try { const r = await fetch('/state'); return r.ok ? r.json() : null; }
  catch { return null; }
}

// ── RELOAD ON FINISH (safety net only) ───────────────────────
// server bumps resetSignal every time /reset is called (guest tapping
// Finish on the receipt screen). runShow() already waits for status to
// go back to "idle" and then loops straight back into pollForOrder()
// on its own (see the tail of runShow()) — no navigation involved, so
// nothing here needs to force a reload on the normal path.
//
// that matters because a real navigation (location.href = ...) throws
// away this tab's autoplay permission. Chrome mostly re-grants it
// instantly from the origin's media-engagement history, but iOS Safari
// does not — the iPad's kitchen.html?audio_only=1 tab never gets tapped
// by anyone, so after a real reload its very next audio.play() (always
// the greeting line, since that's the first sound of every show) gets
// silently rejected by the browser and just... doesn't play. That's the
// most likely explanation for "hey chef we got a new order" going
// missing intermittently. So: only fall back to a real hardReload() if
// the page hasn't already found its own way back to idle standby within
// a generous grace window — i.e. treat it as a genuine stuck-state
// recovery, not a routine per-order refresh.
function hardReload() {
  const url = new URL(location.href);
  url.searchParams.set('_r', Date.now());
  location.href = url.toString();
}
let _isIdleNow = false; // flipped by pollForOrder()/runShow() as the show state machine moves
let _knownResetSignal = null;
let _resetSignalChangedAt = null;
const RESET_STUCK_GRACE_MS = 15000;
setInterval(async () => {
  const d = await pollState();
  if (!d || d.resetSignal === undefined) return;
  if (_knownResetSignal === null) { _knownResetSignal = d.resetSignal; return; }
  if (d.resetSignal !== _knownResetSignal) {
    if (_resetSignalChangedAt === null) _resetSignalChangedAt = Date.now();
    if (_isIdleNow) {
      // already back on its own — no reload needed, don't burn the audio unlock
      _knownResetSignal = d.resetSignal;
      _resetSignalChangedAt = null;
    } else if (Date.now() - _resetSignalChangedAt > RESET_STUCK_GRACE_MS) {
      hardReload();
    }
  }
}, 3000);

// tells the backend which beat of the performance we're on — order.html
// and receipt.html both wait for this to reach "done" before they reveal
// the receipt, instead of the raw generation status. A single failed
// fetch here (transient network blip, a deploy restart window) used to
// silently lose that phase transition forever — for every phase except
// "done" the next call would still get through and catch things up, but
// "done" is the last one ever posted, so a lost "done" left every other
// screen polling forever for a state that would never arrive even though
// this display had already moved on locally. Retry a few times before
// giving up.
async function postPhase(phase) {
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch('/phase', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phase }),
      });
      if (r.ok) return;
    } catch {}
    await sleep(600);
  }
  console.error(`postPhase('${phase}') failed after retries`);
}

// plays the per-order AI-waiter greeting line. This is fixed text ("Hey
// chef, we got a new order.") that never depends on the guest's answers,
// so it's pre-rendered once and shipped as a static file (line_greeting.mp3)
// instead of round-tripping through /state/voice + the server's
// NARRATION_CACHE — that cache lives in server memory and gets wiped on
// every deploy, which used to mean the greeting could take several
// seconds or silently fail to play right after a fresh redeploy.
async function playGreetingAudio() {
  const audio = document.getElementById('voice-audio');
  audio.src = 'line_greeting.mp3';
  await new Promise(resolve => {
    audio.addEventListener('ended', resolve, { once: true });
    audio.play().catch(resolve);
    setTimeout(resolve, 15000); // safety timeout if playback stalls
  });

  // short service-bell sting right after the greeting line
  audio.src = 'greeting_bell.wav';
  await new Promise(resolve => {
    audio.addEventListener('ended', resolve, { once: true });
    audio.play().catch(resolve);
    setTimeout(resolve, 5000);
  });
}

// ── COOKING STAGES ──────────────────────────────────────────
// stage1-3 each play alongside one relay voice's audio, with playback
// rate stretched/compressed so the video finishes exactly when that
// voice's line finishes — not a fixed length. stage4 loops as a generic
// "loading" beat until the dish image itself is actually ready.
const STAGE_VIDEOS    = ['stage1.mp4', 'stage22.mp4', 'stage33.mp4'];
const STAGE_DURATIONS = [7.375, 14.375, 10.375]; // each file's own natural length, seconds
const LOADING_VIDEO   = 'stage44.mp4';

let _captionTimer = null;
// reveals text progressively over totalMs, like a live caption keeping
// pace with speech, instead of dumping the whole line on screen at once
function typewriteCaption(el, text, totalMs) {
  clearInterval(_captionTimer);
  el.textContent = '';
  if (!text) return;
  const perCharMs = Math.max(15, totalMs / text.length);
  let i = 0;
  _captionTimer = setInterval(() => {
    if (i >= text.length) { clearInterval(_captionTimer); return; }
    el.textContent += text[i];
    i++;
  }, perCharMs);
}

async function playSyncedStage(videoSrc, naturalDuration, audioBase64, lineText) {
  const video = document.getElementById('show-video');
  const audio = document.getElementById('relay-audio');
  const captionWrap = document.getElementById('relay-caption-wrap');
  const captionText = document.getElementById('relay-caption');

  if (!AUDIO_ONLY) {
    video.src = videoSrc;
    video.loop = false;
    video.playbackRate = 1;
    video.classList.add('on');
    video.load();
  }

  if (!audioBase64) {
    if (lineText) {
      captionWrap.classList.add('on');
      typewriteCaption(captionText, lineText, naturalDuration * 1000);
    } else {
      captionWrap.classList.remove('on');
    }
    if (!AUDIO_ONLY) { try { await video.play(); } catch {} }
    await sleep(naturalDuration * 1000);
    if (!AUDIO_ONLY) { video.classList.remove('on'); video.pause(); }
    clearInterval(_captionTimer);
    captionWrap.classList.remove('on');
    return;
  }

  audio.src = 'data:audio/mpeg;base64,' + audioBase64;
  await new Promise(resolve => {
    if (audio.readyState >= 1) return resolve();
    audio.addEventListener('loadedmetadata', resolve, { once: true });
    setTimeout(resolve, 3000);
  });
  const audioDuration = (audio.duration && isFinite(audio.duration)) ? audio.duration : naturalDuration;
  if (!AUDIO_ONLY) {
    // stretch/compress the video so it finishes exactly when the audio does
    // — this MUST be set before video.play() below, not after, or the
    // video plays a beat at the wrong (1x) rate first and permanently
    // drifts out of sync with the caption/audio for the rest of the clip
    video.playbackRate = Math.max(0.25, Math.min(4, naturalDuration / audioDuration));
  }

  if (!lineText) captionWrap.classList.remove('on');

  if (!AUDIO_ONLY) { try { await video.play(); } catch {} }
  try { await audio.play(); } catch (err) { console.error('stage audio failed to play', err); }

  // caption reveal must start after the voice actually starts, not
  // before — it used to fire before audio.play() was even called, so the
  // chef's words showed up on screen a beat ahead of anyone actually
  // saying them
  if (lineText) {
    captionWrap.classList.add('on');
    typewriteCaption(captionText, lineText, audioDuration * 1000);
  }

  await new Promise(resolve => {
    audio.addEventListener('ended', resolve, { once: true });
    setTimeout(resolve, (audioDuration + 2) * 1000);
  });

  if (!AUDIO_ONLY) { video.classList.remove('on'); video.pause(); video.playbackRate = 1; }
  clearInterval(_captionTimer);
  captionWrap.classList.remove('on');
}

// sets the final dish image with a safety net: if the given src ever
// fails to actually load (network blip, corrupt data URI, etc — #dish-reveal
// is a plain <img>, so a failed load would otherwise just leave a black
// box with a broken-image glyph, easily mistaken for "nothing happened"),
// fall through to the pre-made fallback cake instead. If even THAT static
// file fails, retry it once after a beat rather than giving up — it's a
// real asset on this same server and should never sustainedly fail.
function revealDishImage(reveal, src) {
  reveal.onerror = () => {
    if (!src.includes('fallback_cake.jpg')) {
      console.warn('dish image failed to load — falling back to fallback_cake.jpg');
      revealDishImage(reveal, 'fallback_cake.jpg');
    } else {
      console.warn('fallback_cake.jpg itself failed to load — retrying once');
      reveal.onerror = null;
      setTimeout(() => { reveal.src = 'fallback_cake.jpg?retry=' + Date.now(); }, 1000);
    }
  };
  reveal.src = src;
  reveal.classList.add('on');
}

async function playLoadingStage(videoSrc, isDone) {
  const video = document.getElementById('show-video');
  if (!AUDIO_ONLY) {
    video.src = videoSrc;
    video.loop = true;
    video.classList.add('on');
    video.load();
    try { await video.play(); } catch {}
  }

  // "microwave on/run" loops for as long as the image is still generating
  // (unknown length — a few seconds to a few minutes), then the "off +
  // beeps" tail plays once as soon as it's actually ready, instead of
  // trying to time-stretch one fixed-length clip to an unpredictable wait.
  const loopAudio = document.getElementById('stage4-loop-audio');
  loopAudio.src = 'stage4_loop.wav';
  loopAudio.currentTime = 0;
  try { await loopAudio.play(); } catch {}

  // the backend retries image generation up to 3 times on failure — each
  // attempt is a prompt-writing call plus the image call itself, and
  // gpt-image-2 alone can take 60-90s+, so a single retry can easily push
  // total time past a minute and a half. Cap generously so a legitimately
  // slow-but-working generation doesn't get cut off before it finishes;
  // still bounded so a truly failed image can't hang the show forever.
  const MAX_IMAGE_WAIT_MS = 100000; // ~100s — long enough for a normal (20-70s) generation, short enough that a live audience isn't left waiting minutes on a failure
  const waitStart = Date.now();
  while (!(await isDone())) {
    if (Date.now() - waitStart > MAX_IMAGE_WAIT_MS) break;
    await sleep(500);
  }

  loopAudio.pause();
  loopAudio.loop = false;
  const endAudio = document.getElementById('stage4-end-audio');
  endAudio.src = 'stage4_end.wav';
  endAudio.play().catch(() => {});

  // reveal the actual generated dish image in place of the loading video,
  // and leave it up — this is the final beat, never falls back to the book
  let imageData = null;
  try {
    const d = await fetch('/state/image').then(r => r.json());
    imageData = d.image;
  } catch {}

  const reveal = document.getElementById('dish-reveal');
  if (imageData) {
    revealDishImage(reveal, 'data:image/png;base64,' + imageData);
  } else {
    // AI generation failed all 3 retries, or ran past the wait cap — a
    // live show can't end with nothing on screen, so fall back to a
    // pre-made cake image rather than looping back to idle empty-handed
    console.warn('no AI-generated image — falling back to fallback_cake.jpg');
    revealDishImage(reveal, 'fallback_cake.jpg');
  }

  if (!AUDIO_ONLY) { video.classList.remove('on'); video.loop = false; video.pause(); }
}

async function playCookingStages() {
  // relay runs before dish generation server-side, so lines should
  // already be there by now — poll briefly just in case, but this is
  // dead time on screen (book already hidden, first stage video not up
  // yet) so keep it tight rather than the 5s this used to allow for
  let lines = [];
  for (let i = 0; i < 6; i++) {
    const d = await pollState();
    lines = (d && d.relayLines) || [];
    if (lines.length >= 3) break;
    await sleep(300);
  }
  if (!lines.length) console.warn('playCookingStages: no relayLines yet in /state');

  // quiet oven-running ambience under the three chefs' voices, looping
  // for however long stage1-3 actually take (each one is stretched to
  // its own voice line's length, so the total isn't fixed)
  const ambient = document.getElementById('stage123-ambient-audio');
  ambient.src = 'stage123_ambient.wav';
  ambient.volume = 0.15;
  ambient.currentTime = 0;
  try { await ambient.play(); } catch {}

  for (let i = 0; i < STAGE_VIDEOS.length; i++) {
    const line = lines[i];
    await playSyncedStage(STAGE_VIDEOS[i], STAGE_DURATIONS[i], line && line.audio, line && line.text);
  }

  ambient.pause();
  ambient.loop = false;

  await playLoadingStage(LOADING_VIDEO, async () => {
    const d = await pollState();
    return !!(d && d.hasImage);
  });
}

// plays a full-screen video beat. Without loopUntil, waits for it to end
// naturally (page-turn). With loopUntil, loops the video and polls the
// given check function until it returns true (cooking, gated on the real
// AI work actually finishing rather than a fixed video length).
async function playShowVideo(src, { loopUntil, keepVisible } = {}) {
  const video = document.getElementById('show-video');
  video.src = src;
  video.loop = !!loopUntil;
  video.classList.add('on');
  video.load();

  // wait until the browser actually has enough data to play, instead of
  // firing play() immediately (which can silently fail if the file is
  // still buffering — this was likely why it worked sometimes and not
  // others). Logs to console on failure so it's actually diagnosable.
  try {
    if (video.readyState < 3) {
      await new Promise((resolve, reject) => {
        video.addEventListener('canplay', resolve, { once: true });
        video.addEventListener('error', reject, { once: true });
        setTimeout(resolve, 8000); // don't block forever if it never fires
      });
    }
    await video.play();
  } catch (err) {
    console.error('playShowVideo: failed to start', src, err);
  }

  if (loopUntil) {
    while (!(await loopUntil())) await sleep(500);
  } else {
    // safety timeout scales with the video's own duration so long videos
    // (e.g. 合成3, ~71s) don't get cut off by a fixed short timeout
    const safetyMs = (video.duration && isFinite(video.duration))
      ? video.duration * 1000 + 3000
      : 90000;
    await new Promise(resolve => {
      video.addEventListener('ended', resolve, { once: true });
      video.addEventListener('error', resolve, { once: true });
      setTimeout(resolve, safetyMs);
    });
  }

  if (!keepVisible) {
    video.classList.remove('on');
    video.loop = false;
    video.pause();
  }
}

// shows a still snapshot of the page-turn video's very first frame as the
// idle standby cover — the recipe book hasn't "opened" yet, so this
// should freeze right at the start, not partway into the video's own
// intro. A video that's never been played doesn't reliably paint a frame
// onto canvas on this browser/hardware, so this still has to nudge it
// forward a tiny amount (not skip ahead to later content) purely to force
// a real decoded frame to exist before snapshotting it.
async function showIdlePageTurnFrame() {
  if (AUDIO_ONLY) return; // purely visual — nothing to capture, no video to load
  const video = document.getElementById('show-video');
  const cover = document.getElementById('idle-cover');
  video.src = PAGE_TURN_VIDEO_SRC;
  video.loop = false;
  video.classList.remove('on'); // keep the actual video element hidden throughout
  // Chrome's video power-saver auto-pauses muted, video-only elements it
  // considers "not visible" — and opacity:0 (from the .on/off class
  // above) qualifies, so play() below gets silently aborted with
  // "video-only background media was paused to save power", the whole
  // idle standby frame never gets captured, and the screen just stays
  // black forever. A barely-nonzero opacity is still invisible to the
  // eye but keeps Chrome from classifying it as background media.
  video.style.opacity = '0.01';
  video.load();
  try {
    // this function is awaited by pollForOrder() before it starts polling
    // for a real order — if video.play() itself never settles (seen on
    // some browser/hardware combos), that would block polling forever, so
    // give it a hard timeout rather than an unbounded await
    await Promise.race([
      video.play(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('play() timed out')), 3000)),
    ]);
    await sleep(80); // just enough for the browser to actually decode/paint a frame
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    cover.src = canvas.toDataURL('image/jpeg', 0.85);
    video.pause();
    cover.classList.add('on');
    document.getElementById('idle-dim').classList.add('on');
  } catch (err) {
    console.error('idle standby frame failed to render', err);
  } finally {
    video.style.opacity = ''; // hand opacity control back to the .on/off class
  }
}

// plays the page-turn video through from the start — swaps the static
// idle-cover image back out for the real (playing) <video> element.
async function playIdlePageTurn() {
  const pageturnAudio = document.getElementById('pageturn-audio');
  pageturnAudio.currentTime = 0;
  pageturnAudio.playbackRate = 0.7;
  pageturnAudio.volume = 0.25;
  pageturnAudio.play().catch(() => {});

  if (AUDIO_ONLY) {
    // no video, no 'ended' event to time off — wait out the real file's
    // known duration instead, so this instance's own pacing still lines
    // up with the real kitchen display's
    await sleep(PAGE_TURN_DURATION_SEC * 1000);
    pageturnAudio.pause();
    return;
  }

  document.getElementById('idle-cover').classList.remove('on');

  const video = document.getElementById('show-video');
  if (!video.src || !video.src.includes(PAGE_TURN_VIDEO_SRC)) {
    video.src = PAGE_TURN_VIDEO_SRC;
    video.load();
  }
  video.loop = false;
  video.playbackRate = PAGE_TURN_PLAYBACK_RATE;
  video.classList.add('on');
  await new Promise(resolve => {
    video.addEventListener('seeked', resolve, { once: true });
    video.currentTime = 0;
    setTimeout(resolve, 500); // don't block forever if 'seeked' never fires
  });
  try { await video.play(); } catch (err) { console.error('page-turn playback failed', err); }

  // page-turn rustle, slowed down and quiet, starts with the video and is
  // cut off the moment the video itself ends — doesn't need to finish
  // naturally, just needs to never outlast the picture
  const safetyMs = (video.duration && isFinite(video.duration))
    ? video.duration * 1000 + 3000
    : 90000;
  await new Promise(resolve => {
    video.addEventListener('ended', resolve, { once: true });
    video.addEventListener('error', resolve, { once: true });
    setTimeout(resolve, safetyMs);
  });

  video.classList.remove('on');
  video.pause();
  pageturnAudio.pause();
}

// tracks the order this display has already shown (or is showing), so
// that looping back into standby after a show doesn't instantly re-trigger
// on the same leftover "done" state — only a genuinely NEW order (a
// different ts) starts the next show
let lastOrderTs = null;

async function pollForOrder() {
  resetDisplay();
  hideStage();
  setIdle(true);
  setPhase('STANDBY');
  _isIdleNow = true;
  // must finish (and fully release the shared #show-video element) before
  // polling starts — otherwise a fast-arriving order can call
  // playIdlePageTurn() while this is still mid-snapshot, and the two race
  // over the same <video> (this one's pause()/idle-cover re-add stomping
  // on the playback playIdlePageTurn() just started)
  await showIdlePageTurnFrame();
  while (true) {
    const s = await pollState();
    if (s && s.ts !== lastOrderTs && (s.status === 'cooking' || s.status === 'done')) {
      lastOrderTs = s.ts;
      runShow(s); return;
    }
    await sleep(900);
  }
}

// ── MAIN SHOW ────────────────────────────────────────────────
async function runShow(state) {
  resetDisplay();
  hideStage();
  setIdle(false);
  _isIdleNow = false;
  document.getElementById('idle-dim').classList.remove('on'); // order submitted — fade the dim out

  // everything from here through the cooking stages is wrapped in one big
  // try/catch — a live audience should never be left staring at a frozen
  // screen because of one unanticipated error (bad/missing server data,
  // an API call none of the existing per-step timeouts covered, etc). Any
  // crash mid-performance forces straight to the same guaranteed-safe
  // fallback cake reveal that a failed image generation already falls
  // back to, instead of hanging here silently with no explanation.
  try {

  // 1 — AI waiter announces the order (back1.mp4 still sitting on its
  // standby frame from idle)
  setPhase('GREETING');
  await postPhase('greeting');
  const GREETING_DELAY_MS = 3000; // line used to fire the instant the order landed — hold it a beat first
  await sleep(GREETING_DELAY_MS);
  await playGreetingAudio();

  // 2 — back1.mp4 now plays through from the start (was paused at idle)
  setPhase('PAGE TURN');
  await postPhase('pageturn');
  if (!SKIP_PAGE_TURN) await playIdlePageTurn();

  // now reveal the paper book — prompts + guest's input appear on it
  revealStage();

  // the recipe/method text read aloud in the cloned voice — this is now
  // the only sound on this page (the soft page-rustle ambience that used
  // to play underneath it was removed on request). Actually started
  // inside revealStage() itself, timed to the exact same beat as the
  // text-overlay video so they stay synced.
  const recipeNarration = document.getElementById('recipe-narration-audio');
  recipeNarration.volume = 0.8;

  // 3 — right page handled by the AE overlay video (method-video, looping
  // already); left page grows the guest's own extracted words on the plate
  setPhase('READING');
  await postPhase('reading');
  // the reading phase has a 30s+ floor either way (MIN_READING_MS below),
  // so there's always time to warm the browser's cache for the first
  // cooking-stage video here — without this, the moment the book faded
  // out and stage1.mp4's src was set for the first time, the browser had
  // to start its fetch from scratch, leaving a beat of blank video before
  // any frame was actually decoded.
  if (!AUDIO_ONLY) fetch(STAGE_VIDEOS[0]).catch(() => {});
  const readingStart = Date.now();
  let cur = state;
  // the backend now always falls back to plain-word tags on its own AI
  // call failing, but this cap is a second line of defence — a live show
  // should never be able to hang here forever, no matter what.
  const MAX_TAGS_WAIT_MS = 60000;
  while (!cur?.emotionTags?.length) {
    if (Date.now() - readingStart > MAX_TAGS_WAIT_MS) { cur = { emotionTags: ['memory'] }; break; }
    await sleep(900); cur = await pollState() || cur;
  }
  await showTags(cur.emotionTags);

  // hold the recipe page for at least this long, regardless of how fast
  // the AI responds, so it never gets cut short mid-read
  const MIN_READING_MS = 30000;
  const readingElapsed = Date.now() - readingStart;
  if (readingElapsed < MIN_READING_MS) await sleep(MIN_READING_MS - readingElapsed);

  // 4 — the method-video now loops continuously (see revealStage()) so
  // it never fires 'ended' on its own — the narration is what actually
  // paces this beat. Hold here until it's actually finished talking,
  // then explicitly stop the looping video ourselves.
  if (!recipeNarration.ended && !recipeNarration.paused) {
    await new Promise(resolve => {
      recipeNarration.addEventListener('ended', resolve, { once: true });
      // recipe_narration.mp3 itself runs ~47s — this cap only exists for
      // a genuinely stalled playback, so it needs real headroom above
      // that, not a number shorter than the file itself
      setTimeout(resolve, 65000);
    });
  }
  recipeNarration.pause();
  if (!AUDIO_ONLY) {
    const mv = document.getElementById('method-video');
    mv.loop = false;
    mv.pause();
  }
  hideStage(); // book fades out for real, not just covered by the opaque video on top of it
  setPhase('COOKING');
  await postPhase('cooking');
  await playCookingStages();

  } catch (err) {
    console.error('runShow crashed mid-performance — forcing fallback cake reveal', err);
    hideStage();
    document.getElementById('show-video').classList.remove('on');
    // whatever ambience was mid-play when this crashed shouldn't keep
    // playing into the fallback/cooking/done phases that follow
    ['pageturn-audio', 'reading-ambient-audio', 'recipe-narration-audio', 'relay-audio', 'stage123-ambient-audio']
      .forEach(id => { const el = document.getElementById(id); if (el) el.pause(); });
    revealDishImage(document.getElementById('dish-reveal'), 'fallback_cake.jpg');
  }

  // 5 — done; only now does the ordering screen's receipt unlock.
  setPhase('COMPLETE');
  await postPhase('done');

  // hold the final reveal until the guest actually clicks FINISH/ORDER
  // AGAIN on the ordering screen (which calls /reset there and flips
  // status back to "idle" — see index.html newOrder()), with a 2-minute
  // safety-net fallback in case that click never happens (guest just
  // walks away) so this display doesn't get stuck showing an old order
  // forever.
  const MAX_REVEAL_HOLD_MS = 120000;
  const revealStart = Date.now();
  while (true) {
    const s = await pollState();
    if (s && s.status === 'idle') break;
    if (Date.now() - revealStart > MAX_REVEAL_HOLD_MS) break;
    await sleep(1000);
  }
  pollForOrder();
}

// ── DEMO — press T ───────────────────────────────────────────
async function startDemo() {
  const DEMO_TAGS = ['pink', 'sweet', 'birthday', 'warm', 'candle'];
  resetDisplay();
  hideStage();
  setIdle(false);
  _isIdleNow = false;
  document.getElementById('idle-dim').classList.remove('on');

  // same standby-frame -> back1.mp4 -> reveal sequence as the real flow,
  // no backend/API calls involved — press T anytime to iterate on this
  setPhase('DEMO — PAGE TURN');
  if (!SKIP_PAGE_TURN) await playIdlePageTurn();
  revealStage();

  setPhase('DEMO');
  await sleep(800);
  await showTags(DEMO_TAGS);

  // once the method text video finishes, follow it with 合成3 in full
  if (!AUDIO_ONLY) {
    const mv = document.getElementById('method-video');
    if (!mv.ended) {
      await new Promise(resolve => {
        mv.addEventListener('ended', resolve, { once: true });
        mv.addEventListener('error', resolve, { once: true });
        setTimeout(resolve, 45000);
      });
    }
  }
  const recipeNarrationDemo = document.getElementById('recipe-narration-audio');
  if (!recipeNarrationDemo.ended && !recipeNarrationDemo.paused) {
    await new Promise(resolve => {
      recipeNarrationDemo.addEventListener('ended', resolve, { once: true });
      setTimeout(resolve, 20000);
    });
  }
  recipeNarrationDemo.pause();
  hideStage();
  setPhase('DEMO — COOKING');
  await playCookingStages();

  setPhase('DEMO — COMPLETE');
}

// demo hotkey is on by default (for ongoing testing) — on the actual
// exhibition day, load this page as kitchen.html?demo=off so an
// accidental keypress can't interrupt a real live show
const DEMO_HOTKEY_ENABLED = new URLSearchParams(location.search).get('demo') !== 'off';
window.addEventListener('keydown', e => {
  if (!DEMO_HOTKEY_ENABLED) return;
  if ((e.key === 't' || e.key === 'T') && e.target === document.body) startDemo();
});

pollForOrder();
</script>
